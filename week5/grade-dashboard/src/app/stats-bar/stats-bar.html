<div class="stats">

  <div class="stat">
    <span class="stat__value">{{ total }}</span>
    <span class="stat__label">Students</span>
  </div>

  <div class="stat">
    <span class="stat__value">{{ average }}</span>
    <span class="stat__label">Class Average</span>
  </div>

  <div class="stat stat--green">
    <span class="stat__value">{{ passing }}</span>
    <span class="stat__label">Passing</span>
  </div>

  <div class="stat stat--red">
    <span class="stat__value">{{ failing }}</span>
    <span class="stat__label">Failing</span>
  </div>

  <div class="stat stat--purple">
    <span class="stat__value">{{ topStudents }}</span>
    <span class="stat__label">Top (≥90)</span>
  </div>

</div>
