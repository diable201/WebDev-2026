<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
        #todoInput { padding: 8px; width: 250px; font-size: 16px; }
        #addBtn { padding: 8px 16px; font-size: 16px; cursor: pointer; }
        li { padding: 10px; cursor: pointer; font-size: 18px;
             border-bottom: 1px solid #eee; list-style: none; }
        li:hover { background: #f5f5f5; }
        .done { text-decoration: line-through; color: #999; }
    </style>
</head>
<body>
    <h1>Simple To-Do List</h1>
    <input id="todoInput" placeholder="Enter a new task...">
    <button id="addBtn">Add Task</button>

    <ul id="todoList"></ul>

    <script>
        const input = document.querySelector("#todoInput");
        const addBtn = document.querySelector("#addBtn");
        const list = document.querySelector("#todoList");

        function addTask() {
            const text = input.value.trim();
            if (!text) return;

            const li = document.createElement("li");
            li.textContent = text;

            li.addEventListener("click", () => {
                li.classList.toggle("done");
            });

            list.appendChild(li);
            input.value = "";
            input.focus();
        }

        addBtn.addEventListener("click", addTask);
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                console.log("Enter key pressed");
                addTask();
            }
        });
    </script>
</body>    
</html>
